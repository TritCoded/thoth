name: Feature Request
description: Suggest an idea or improvement for Thoth
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make Thoth better? Fill out the sections below.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is this related to something that frustrates you or that's missing today?
      placeholder: e.g. I have no way to keep two drafts open at once.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should Thoth do instead/additionally?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches or workarounds you've tried.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use regularly
        - Blocking my use of the extension
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, links, related issues, etc.
    validations:
      required: false
